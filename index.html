<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050607">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>AKWAOS // STOPPED</title>
<style>
:root{
  --bg:#050607;
  --line:rgba(149,255,214,.18);
  --text:#d8fff1;
  --muted:#76a899;
  --accent:#8dffd5;
  --red:#ff2f3d;
}
*{box-sizing:border-box}
html,body{height:100%}
html,body,body *{
  user-select:none;
  -webkit-user-select:none;
  -ms-user-select:none;
  -webkit-touch-callout:none;
}
body{
  margin:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 42%,rgba(44,90,76,.14),transparent 34%),
    linear-gradient(180deg,#030405 0%,#06090a 100%);
  color:var(--text);
  font-family:"Courier New",Consolas,monospace;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.026) 0,
    rgba(255,255,255,.026) 1px,
    transparent 1px,
    transparent 4px
  );
  opacity:.38;
  z-index:30;
}
body::after{
  content:"";
  position:fixed;
  inset:-20%;
  pointer-events:none;
  background:radial-gradient(circle,transparent 42%,rgba(0,0,0,.74) 78%);
  z-index:29;
}
.noise{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:28;
  opacity:.04;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  animation:noiseMove .15s steps(2) infinite;
}
@keyframes noiseMove{
  0%{transform:translate(0,0)}
  25%{transform:translate(-1%,1%)}
  50%{transform:translate(1%,-1%)}
  75%{transform:translate(1%,1%)}
  100%{transform:translate(0,0)}
}
.screen{
  position:relative;
  z-index:2;
  height:100%;
  display:grid;
  grid-template-rows:auto 1fr auto;
  padding:22px 24px;
}
.topbar,.bottombar{
  display:flex;
  justify-content:space-between;
  gap:16px;
  align-items:center;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  opacity:.74;
}
.center{
  display:flex;
  align-items:center;
  justify-content:center;
}
.terminal{
  position:relative;
  width:min(940px,94vw);
  min-height:440px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:44px;
  border:1px solid var(--line);
  background:
    linear-gradient(180deg,rgba(8,13,15,.89),rgba(4,7,8,.72));
  box-shadow:
    0 0 40px rgba(122,255,210,.08),
    inset 0 0 40px rgba(112,255,205,.018);
  overflow:hidden;
}
.terminal::before,.terminal::after{
  content:"";
  position:absolute;
  width:24px;
  height:24px;
  border-color:rgba(149,255,214,.56);
}
.terminal::before{
  left:-1px;
  top:-1px;
  border-left:1px solid;
  border-top:1px solid;
}
.terminal::after{
  right:-1px;
  bottom:-1px;
  border-right:1px solid;
  border-bottom:1px solid;
}
.stage{
  position:relative;
  width:100%;
  text-align:center;
}
.kicker{
  margin-bottom:22px;
  color:var(--muted);
  font-size:11px;
  letter-spacing:.26em;
  text-transform:uppercase;
}
.word{
  position:relative;
  display:inline-block;
  min-height:1em;
  font-size:clamp(42px,8vw,100px);
  line-height:.95;
  font-weight:700;
  letter-spacing:.035em;
  text-transform:uppercase;
  color:var(--red);
  text-shadow:
    0 0 9px rgba(255,47,61,.55),
    0 0 28px rgba(255,47,61,.22);
}
.word::before,
.word::after{
  content:attr(data-text);
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
}
.word.glitch::before{
  color:#ff6170;
  transform:translate(4px,-2px);
  clip-path:inset(8% 0 64% 0);
  opacity:.65;
}
.word.glitch::after{
  color:#8dffd5;
  transform:translate(-4px,2px);
  clip-path:inset(66% 0 8% 0);
  opacity:.35;
}
.word.blink{
  animation:blinkWord .58s steps(2,end);
}
@keyframes blinkWord{
  0%{opacity:1}
  12%{opacity:.05}
  22%{opacity:1}
  38%{opacity:.22}
  48%{opacity:1}
  69%{opacity:.04}
  82%{opacity:1}
  100%{opacity:1}
}
.word.lag{
  animation:lagWord .5s steps(2,end);
}
@keyframes lagWord{
  0%{transform:translate(0,0) scale(1)}
  18%{transform:translate(3px,-1px) scale(1.006)}
  36%{transform:translate(-2px,2px) scale(.997)}
  56%{transform:translate(4px,0) scale(1.004)}
  74%{transform:translate(-1px,-2px)}
  100%{transform:translate(0,0) scale(1)}
}
.statusline{
  margin-top:30px;
  min-height:20px;
  color:#7da99c;
  font-size:10px;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.cursor{
  display:inline-block;
  width:8px;
  height:12px;
  margin-left:6px;
  background:var(--accent);
  transform:translateY(2px);
  animation:cursorBlink .8s steps(1) infinite;
}
@keyframes cursorBlink{50%{opacity:0}}
.scan{
  position:absolute;
  left:0;
  right:0;
  top:-4px;
  height:2px;
  background:rgba(255,47,61,.32);
  box-shadow:0 0 14px rgba(255,47,61,.24);
  animation:scanMove 4.8s linear infinite;
  pointer-events:none;
}
@keyframes scanMove{
  from{transform:translateY(0)}
  to{transform:translateY(460px)}
}
body.hit{
  animation:screenHit .44s steps(2,end);
}
@keyframes screenHit{
  0%{filter:none}
  16%{filter:brightness(1.6) contrast(1.25)}
  28%{filter:brightness(.5) contrast(1.5)}
  44%{filter:brightness(1.3)}
  60%{filter:none}
  74%{filter:brightness(.72)}
  100%{filter:none}
}
.terminal.hit{
  animation:terminalShift .44s steps(2,end);
}
@keyframes terminalShift{
  0%,100%{transform:translate(0,0)}
  18%{transform:translate(3px,-1px)}
  36%{transform:translate(-4px,1px)}
  54%{transform:translate(2px,2px)}
  72%{transform:translate(-1px,-1px)}
}
.freeze{
  position:fixed;
  inset:0;
  z-index:40;
  pointer-events:none;
  opacity:0;
  background:
    linear-gradient(180deg,transparent 0 35%,rgba(255,255,255,.08) 35% 36%,transparent 36% 100%);
}
.freeze.show{
  animation:freezeFrame .18s steps(1,end);
}
@keyframes freezeFrame{
  0%{opacity:0}
  25%{opacity:.9}
  55%{opacity:.2}
  100%{opacity:0}
}
@media(max-width:640px){
  .screen{padding:16px}
  .terminal{padding:30px 18px;min-height:390px}
  .topbar,.bottombar{font-size:8px}
  .bottombar span:last-child{display:none}
}
</style>
</head>
<body>

<div class="freeze" id="ДжонГарсия"></div>

  <span>AKWAOS // NODE 04-09</span>

</main>

</body>
